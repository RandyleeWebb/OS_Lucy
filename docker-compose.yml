services:
  icecast:
    image: moul/icecast
    container_name: icecast
    ports:
      - "8000:8000"
    environment:
      - ICECAST_SOURCE_PASSWORD=hackme
      - ICECAST_ADMIN_PASSWORD=hackme
      - ICECAST_PASSWORD=hackme

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: liquidsoap
    volumes:
      - ./ai_dj:/app
    working_dir: /app
    command: ["liquidsoap", "/app/radio.liq"]
    ports:
      - "1234:1234"

  api:
    build: ./src
    container_name: api
    ports:
      - "8001:8001"
    volumes:
      - ./ai_dj:/app/ai_dj

  generator:
    build: ./src/generator
    container_name: generator
    volumes:
      - ./generated:/app/generated
    ports:
      - "8002:8002"
    depends_on:
      - icecast
      - liquidsoap

  capability_manager:
    build: ./src/capability_manager
    container_name: capability_manager
    ports:
      - "8003:8003"
    volumes:
      - ./data:/app/data
    depends_on:
      - api

  tool_registry:
    build: ./src/tool_registry
    container_name: tool_registry
    ports:
      - "8005:8005"
    volumes:
      - ./data:/app/data
    environment:
      - TOOL_REGISTRY_SECRET=lucy-secret
    depends_on:
      - capability_manager

  planner:
    build: ./src/planner
    container_name: planner
    ports:
      - "8006:8006"
    environment:
      - PLANNER_SECRET=lucy-secret
    volumes:
      - ./data:/app/data
    depends_on:
      - capability_manager
      - tool_registry

  scheduler:
    build: ./src/scheduler
    container_name: scheduler
    ports:
      - "8007:8007"
    volumes:
      - ./data:/app/data
    environment:
      - SCHEDULER_SECRET=lucy-secret
    depends_on:
      - planner
      - tool_registry
      - capability_manager

  worker:
    build: ./src/worker
    container_name: worker
    environment:
      - SCHEDULER_SECRET=lucy-secret
    depends_on:
      - scheduler
      - redis

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  emma:
    build: ./src/emma
    container_name: emma
    working_dir: /app
    command: uvicorn main:app --host 0.0.0.0 --port 8010
    ports:
      - "8010:8010"
    environment:
      - EMMA_SECRET=lucy-secret
      - REDIS_URL=redis://redis:6379
      - HTTP_PROXY=http://proxy:3128
    depends_on:
      - redis
      - self_extension
    restart: unless-stopped

  self_extension:
    build: ./src/self_extension
    container_name: self_extension
    ports:
      - "8004:8004"
    environment:
      - SELF_EXT_SECRET=lucy-secret
      - REDIS_URL=redis://redis:6379
      - EMMA_NOTIFY_URL=http://emma:8010/notify
      - HTTP_PROXY=http://proxy:3128
    depends_on:
      - redis
    volumes:
      - ./:/app/repo
      - ./data:/app/data
  proxy:
    image: serjs/go-socks5-proxy
    container_name: proxy
    ports:
      - "3128:1080"
    restart: unless-stopped
    environment:
      - REQUIRE_AUTH=false
      - PROXY_USER=lucy
      - PROXY_PASSWORD=lucy

  weather:
    build: ./plugins/weather
    container_name: weather
    ports:
      - "9000:9000"
    restart: unless-stopped

  datavault:
    build: ./src/datavault
    container_name: datavault
    ports:
      - "8012:8012"
    volumes:
      - ./data:/data

  safeguard:
    build: ./src/safeguard
    container_name: safeguard
    ports:
      - "8013:8013"
    environment:
      - DATAVAULT_URL=http://datavault:8012/log
    depends_on:
      - datavault

  evolutionary-prompt:
    build: ./src/evolutionary_prompt
    container_name: evolutionary-prompt
    ports:
      - "8014:8014"
    environment:
      - EP_ETA=0.1
      - EP_LAMBDA=0.01
    depends_on:
      - datavault

  perfmon:
    build: ./src/perfmon
    container_name: perfmon
    command: python agent.py
    environment:
      - DATAVAULT_URL=http://datavault:8012/log
      - EP_URL=http://evolutionary-prompt:8014/prompt/update
    depends_on:
      - datavault
      - evolutionary-prompt
  orchestrator:
    build: ./src/orchestrator
    container_name: orchestrator
    ports:
      - "8020:8020"
    environment:
      - DATAVAULT_URL=http://datavault:8012/log
      - SAFEGUARD_URL=http://safeguard:8013/audit
      - PROMPT_URL=http://evolutionary-prompt:8014/prompt/update
    depends_on:
      - datavault
      - safeguard
      - evolutionary-prompt
  homeostasis:
    build: ./src/homeostasis
    container_name: homeostasis
    environment:
      - DATAVAULT_URL=http://datavault:8012/log
      - ORCHESTRATOR_URL=http://orchestrator:8020/inject_proactive
    depends_on:
      - datavault
      - orchestrator
    ports:
      - "8030:8030"
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
  trusted-executor:
    build: ./src/trusted_executor
    container_name: trusted-executor
    ports:
      - "8040:8040"
    depends_on:
      - datavault
    environment:
      - PERM_THREAD=1
    # ensure wasmtime is available in the container
    healthcheck:
      test: ["CMD", "sh", "-c", "command -v wasmtime >/dev/null || python -c \"import wasmtime\"\" ]
      interval: 1m30s
      timeout: 10s
      retries: 3
    security_opt:
      - no-new-privileges:true
    user: 1000:1000

volumes:
  ollama_models:
